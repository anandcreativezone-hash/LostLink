<div class="register-container">
<div class="top-buttons">

    <button
    routerLink="/"
    class="home-btn">

        ← Back to Home

    </button>

</div>
    <div class="register-card">

        <div class="logo-box"></div>

        <h1>
            Request Access
        </h1>

        <p class="subtitle">
            Create an account to access the Lost & Found Portal.
            All registrations require approval from the Authority Center.
        </p>

        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                [(ngModel)]="username"
                placeholder="Choose a username">

        </div>

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                [(ngModel)]="email"
                placeholder="Enter your email">

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="text"
                [(ngModel)]="phone"
                placeholder="Enter your phone number">

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                [(ngModel)]="password"
                placeholder="Create password">

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                [(ngModel)]="confirmPassword"
                placeholder="Confirm password">

        </div>

        <button
            class="register-btn"
            (click)="register()">

            Submit Registration Request

        </button>

        <div
            class="message-box"
            *ngIf="message">

            {{message}}

        </div>

    </div>

</div>
